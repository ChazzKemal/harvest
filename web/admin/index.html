<!doctype html>
<!-- The admin record, from a browser. Same page as out/admin.html, but live:
     it signs in with Google and reads Supabase with the publishable key, so it
     can sit on the open internet. What lets it see everyone's rows is not a
     secret baked in here - there is none - but the admins table: the *_read_admin
     policies open every table to a signed-in email listed there, and to nobody
     else. Anyone else who finds the URL signs in and sees an empty record.

     Host it anywhere static - Vercel's free tier serves this folder as-is.
     Remember to add the deployed URL to Supabase's auth redirect allowlist. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harvest — everyone</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0c0d; --panel:#141416; --raised:#1b1b1e; --line:#27272b;
  --fg:#e8e8ea; --muted:#8b8b93; --dim:#5f5f67;
  --accent:#d97757; --green:#4ade80; --red:#f87171; --blue:#7aa2f7;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
body{background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
     -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.app{display:grid;grid-template-columns:248px minmax(0,1fr) 268px;min-height:100vh}
@media(max-width:1100px){.app{grid-template-columns:1fr}.side,.rail{display:none}}

.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:4px 10px 20px;font-weight:600;letter-spacing:-.01em}
.brand .dot{width:22px;height:22px;border-radius:6px;background:var(--accent);display:grid;place-items:center;font-size:12px}
.navlabel{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.07em;padding:16px 10px 7px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--muted);cursor:pointer;font-size:13.5px;line-height:1.4}
.nav:hover{background:var(--raised);color:var(--fg)}
.nav.on{background:var(--raised);color:var(--fg);font-weight:500}
.nav .n{margin-left:auto;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}

.main{min-width:0;padding:0 0 80px}
.crumbs{display:flex;align-items:center;gap:9px;padding:16px 32px;color:var(--muted);font-size:13px;
        border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.crumbs b{color:var(--fg);font-weight:500}
.crumbs .sep{color:var(--dim)}
.crumbs .me{margin-left:auto;color:var(--dim);font-size:12.5px}
.crumbs .out{color:var(--muted);cursor:pointer;font-size:12.5px}
.crumbs .out:hover{color:var(--fg)}
.body{padding:30px 32px;max-width:900px}
h1{font-size:26px;line-height:1.25;letter-spacing:-.02em;font-weight:600;margin-bottom:12px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px 17px;margin-bottom:12px}
.quote{border-left:2px solid var(--line);padding:2px 0 2px 13px;color:var(--muted);font-size:13px;font-style:italic;margin-top:8px}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:26px;text-align:center}

.rail{border-left:1px solid var(--line);padding:22px 18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.rail h4{font-size:12.5px;font-weight:600;margin:22px 0 10px}
.rail h4:first-child{margin-top:0}
.f{display:flex;align-items:center;gap:9px;padding:5px 0;color:var(--muted);font-size:13px;cursor:pointer}
.f:hover{color:var(--fg)}
.f input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}
.f .n{margin-left:auto;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.stat{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;color:var(--muted)}
.stat b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.hide{display:none}
.none{display:none !important}

/* conversation */
.thread{position:relative;padding-left:44px}
.thread:before{content:"";position:absolute;left:15px;top:8px;bottom:8px;width:1px;background:var(--line)}
.turn{position:relative;margin-bottom:14px}
.av{position:absolute;left:-44px;top:0;width:26px;height:26px;border-radius:50%;
    display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--raised);
    border:1px solid var(--line);color:var(--muted)}
.av.user{background:#3b2a25;border-color:rgba(217,119,87,.4);color:var(--accent)}
.av.bot{background:#1e2a24;border-color:rgba(74,222,128,.3);color:var(--green)}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 16px}
.msg .mbody{white-space:pre-wrap;word-wrap:break-word}
.tmeta{color:var(--dim);font-size:12px;margin-top:8px}
.say{padding:2px 0 4px;white-space:pre-wrap;word-wrap:break-word}
details.steps{margin-bottom:14px}
details.steps>summary{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:11px 15px;color:var(--muted);font-size:13px;cursor:pointer;list-style:none;
    display:flex;align-items:center;gap:8px}
details.steps>summary::-webkit-details-marker{display:none}
details.steps>summary:after{content:"⌄";margin-left:auto;color:var(--dim)}
details.steps[open]>summary:after{content:"⌃"}
.step{border-left:1px solid var(--line);margin:9px 0 0 14px;padding:7px 0 7px 14px}
.step code{font-family:var(--mono);font-size:12px;color:var(--fg);word-break:break-all}
.step .out{font-family:var(--mono);font-size:11.5px;color:var(--dim);white-space:pre-wrap;
    margin-top:6px;max-height:160px;overflow:auto}
.think{color:var(--dim);font-size:13px;font-style:italic;padding:2px 0 6px}

/* admin extras - same as out/admin.html */
.diff{font-family:var(--mono);font-size:12px;line-height:1.5;background:var(--bg);
      border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;
      max-height:460px;overflow-y:auto;white-space:pre}
.diff .add{color:var(--green)} .diff .del{color:var(--red)} .diff .hd{color:var(--blue)}
.sess summary{cursor:pointer;list-style:none}
.sess summary::-webkit-details-marker{display:none}
.sess[open] summary{margin-bottom:14px}
.subtabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:4px 0 14px}
.subtab{color:var(--muted);font-size:12.5px;padding:5px 0;cursor:pointer;border-bottom:2px solid transparent}
.subtab.on{color:var(--fg);border-bottom-color:var(--accent)}
.rowhead{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:4px;
      background:var(--raised);color:var(--muted);border:1px solid var(--line)}
.chip.on{color:var(--accent);border-color:rgba(217,119,87,.28)}
.said{color:var(--fg);font-size:13.5px;margin-top:3px}
.said b{color:var(--accent);font-weight:500}
.assumed{color:var(--muted);font-size:13px}
.bar{display:flex;align-items:center;gap:9px;margin:4px 0;font-size:12.5px;color:var(--muted)}
.bar .track{flex:1;height:6px;background:var(--raised);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);opacity:.75}
.bar .lab{width:150px;color:var(--fg);font-size:12.5px}
.bar .n{width:28px;text-align:right;font-variant-numeric:tabular-nums}
.group h3{font-size:15px;font-weight:600;margin:22px 0 10px;cursor:pointer}
.group h3 .gcount{color:var(--dim);font-size:12px;font-weight:400;margin-left:6px}
.group.shut .card{display:none}

/* gates */
.gate{min-height:100vh;display:grid;place-items:center}
.gate .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:44px 48px;text-align:center;max-width:420px}
.gate h1{margin-bottom:8px}
.gate p{color:var(--muted);margin-bottom:26px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--raised);
  border:1px solid var(--line);border-radius:8px;padding:11px 22px;color:var(--fg);
  font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
</style>

<div id="gate" class="gate"><div class="box">
  <div class="brand" style="justify-content:center"><span class="dot">◆</span> Harvest</div>
  <h1>The record</h1>
  <p id="gate-msg">Sign in to read it. Only approved admins see anything.</p>
  <button class="btn" id="signin">Sign in with Google</button>
</div></div>

<div id="app" class="app hide">
  <aside class="side">
    <div class="brand"><span class="dot">◆</span> Harvest</div>
    <div class="navlabel">Everyone</div>
    <div id="navs"></div>
  </aside>
  <main class="main">
    <div class="crumbs"><b>All engineers</b><span class="sep">/</span><span id="crumb"></span>
      <span class="me" id="me"></span><span class="out" id="signout">sign out</span></div>
    <div class="body" id="views"></div>
  </main>
  <aside class="rail" id="rail"></aside>
</div>

<script>
const SUPABASE_URL = "https://qxdtkrsyozmpbecyccjb.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_WBkhbCcAdTk1QEAW82N0bg_HL8RX5bz";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = iso => iso ? iso.slice(0,16).replace("T"," ") : "";

const TYPE_LABELS = {
  data_semantics:"What the data means", hygiene_rule:"Data hygiene",
  implicit_constraint:"Unmodelled constraints", objective_tradeoff:"What good looks like",
  acceptance_heuristic:"How they judge an answer", exception_override:"Manual overrides",
  vocabulary:"Vocabulary"};

// ------------------------------------------------------------------ sign-in
$("#signin").onclick = () => sb.auth.signInWithOAuth({
  provider: "google",
  options: { redirectTo: location.origin + location.pathname }});
$("#signout").onclick = async () => { await sb.auth.signOut(); location.reload(); };

// Deferred: supabase-js holds an internal lock while this callback runs, so
// awaiting another auth-bound call (the is_admin rpc) inside it deadlocks and
// the page silently stays on the gate.
sb.auth.onAuthStateChange((_e, session) => { if (session) setTimeout(() => start(session), 0); });
sb.auth.getSession().then(({data:{session}}) => { if (session) start(session); });

let started = false;
async function start(session) {
  if (started) return; started = true;
  $("#me").textContent = session.user.email;
  const { data: admin, error } = await sb.rpc("is_admin");
  if (error || !admin) {
    $("#gate-msg").innerHTML =
      `Signed in as <b>${esc(session.user.email)}</b>, which is not an admin.<br>` +
      "An admin can approve it: <code>insert into admins (email) values ('...');</code>";
    $("#signin").textContent = "Try another account";
    started = false;
    await sb.auth.signOut();
    return;
  }
  render(await load());
  $("#gate").classList.add("hide");
  $("#app").classList.remove("hide");
}

// --------------------------------------------------------------------- data
async function rows(table) {
  const out = [];
  for (let from = 0;; from += 1000) {
    const { data, error } = await sb.from(table).select("*").range(from, from + 999);
    if (error) { console.error(table, error); break; }
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}

function latestBatch(rs) {
  const newest = {};
  for (const r of rs) {
    const w = r.created_at || "";
    if (w > (newest[r.session_id] || "")) newest[r.session_id] = w;
  }
  const keep = new Set(rs.filter(r => (r.created_at || "") === newest[r.session_id])
                         .map(r => r.batch));
  const batched = new Set(rs.filter(r => r.batch).map(r => r.session_id));
  return rs.filter(r => r.batch ? keep.has(r.batch) : !batched.has(r.session_id));
}

async function load() {
  const [engineers, claims, corrections, asks, chats] = await Promise.all(
    ["engineers", "claims", "corrections", "asks", "chats"].map(rows));
  const names = Object.fromEntries(engineers.map(e => [e.id, e.name || e.email]));
  return { engineers, names,
           claims: latestBatch(claims), corrections: latestBatch(corrections),
           asks, chats };
}

// ------------------------------------------------------------------- render
const count = (rs, f) => {
  const c = {};
  for (const r of rs) { const k = f(r); if (k) c[k] = (c[k] || 0) + 1; }
  return Object.entries(c).sort((a, b) => b[1] - a[1]);
};

const attrs = (r, names) =>
  `data-who="${esc(names[r.engineer] || "unknown")}" ` +
  `data-tool="${esc(r.tool || "")}" data-proj="${esc(r.project || "")}"`;

function thread(chat) {
  const turns = chat.turns || [];
  if (!turns.length) return '<div class="empty">No transcript kept for this session.</div>';
  const out = []; let pending = [];
  const flush = () => {
    if (!pending.length) return;
    const tools = pending.filter(x => x.role === "tool");
    const says = pending.filter(x => x.role === "assistant");
    const thinks = pending.filter(x => x.role === "reasoning");
    if (tools.length || thinks.length) {
      const inner = pending.map(x => {
        if (x.role === "tool") {
          let b = `<code>${esc((x.text || "").slice(0, 400))}</code>`;
          if (x.output) b += `<div class="out">${esc(x.output.slice(0, 1200))}</div>`;
          return `<div class="step"><b>${x.kind === "exec" ? "ran" : "edited"}</b> ${b}</div>`;
        }
        if (x.role === "reasoning" && x.text)
          return `<div class="step think">${esc(x.text.slice(0, 600))}</div>`;
        return "";
      }).join("");
      out.push(`<details class="steps"><summary>${says.length} messages, ` +
               `${tools.length} tool calls</summary>${inner}</details>`);
    }
    for (const x of says)
      out.push(`<div class="turn"><div class="av bot">◈</div>` +
               `<div class="say">${esc(x.text)}</div></div>`);
    pending = [];
  };
  for (const t of turns) {
    if (t.role === "user") {
      flush();
      out.push(`<div class="turn"><div class="av user">U</div>` +
               `<div class="msg"><div class="mbody">${esc(t.text)}</div>` +
               `<div class="tmeta">${ago(t.ts || "")}</div></div></div>`);
    } else pending.push(t);
  }
  flush();
  return `<div class="thread">${out.join("")}</div>`;
}

function diffHtml(diff) {
  if (!(diff || "").trim())
    return '<div class="empty">No code changes recorded for this session.</div>';
  const lines = diff.split("\n").slice(0, 2000).map(l => {
    const cls = /^(diff |@@|index |--- |\+\+\+ )/.test(l) ? "hd"
              : l.startsWith("+") ? "add" : l.startsWith("-") ? "del" : "";
    return cls ? `<span class="${cls}">${esc(l)}</span>` : esc(l);
  });
  return `<div class="diff">${lines.join("\n")}</div>`;
}

function sessionCard(r, names) {
  const turns = r.turns || [];
  const asked = turns.filter(t => t.role === "user");
  const title = asked.length
    ? (asked[0].text || "").trim().split("\n")[0].slice(0, 90) : "no prompt recorded";
  const files = r.files || [];
  const changed = files.length
    ? `<span class="chip">${files.length} file(s)</span>` +
      `<span class="chip">+${r.added || 0} −${r.removed || 0}</span>` : "";
  const commits = (r.commits || []).length ? '<span class="chip on">committed</span>' : "";
  return `<details class="card sess" ${attrs(r, names)}>` +
    `<summary><div class="rowhead">` +
    `<span class="chip">${esc(names[r.engineer] || "unknown")}</span>` +
    `<b>${esc(r.tool || "no tool")}</b>` +
    `<span class="chip">${ago(r.started_at || "")}</span>${changed}${commits}</div>` +
    `<div class="said">${esc(title)}</div></summary>` +
    `<div class="subtabs">` +
    `<span class="subtab on" data-pane="talk">Conversation</span>` +
    `<span class="subtab" data-pane="code">What changed</span></div>` +
    `<div class="pane pane-talk">${thread(r)}</div>` +
    `<div class="pane pane-code hide">` +
    (files.length ? `<div class="assumed">${esc(files.slice(0, 20).join(", "))}</div>` : "") +
    diffHtml(r.diff || "") + `</div></details>`;
}

function boxes(cls, counts) {
  return counts.map(([k, n]) =>
    `<label class="f"><input type="checkbox" class="${cls}" value="${esc(k)}">` +
    `${esc(k)}<span class="n">${n}</span></label>`).join("");
}

function render(d) {
  const { names, claims, corrections, asks, chats, engineers } = d;
  const everything = [...claims, ...corrections, ...asks, ...chats];

  // where people got stuck
  const byTool = count(corrections, r => r.tool);
  const peak = Math.max(1, ...byTool.slice(0, 10).map(([, n]) => n));
  const bars = byTool.slice(0, 10).map(([t, n]) =>
    `<div class="bar"><span class="lab">${esc(t)}</span>` +
    `<span class="track"><span class="fill" style="width:${(n / peak * 100).toFixed(0)}%"></span></span>` +
    `<span class="n">${n}</span></div>`).join("");
  const stuck = [...corrections]
    .sort((a, b) => (b.corrected_on || "").localeCompare(a.corrected_on || ""))
    .map(r => `<div class="card" ${attrs(r, names)}>` +
      `<div class="rowhead"><b>${esc(r.tool || "no tool")}</b>` +
      `<span class="chip">${esc(names[r.engineer] || "unknown")}</span>` +
      `<span class="chip">${esc(r.corrected_on)}</span></div>` +
      `<div class="assumed">assumed — ${esc(r.agent_assumed)}</div>` +
      `<div class="said">they said — <b>${esc(r.person_said)}</b></div>` +
      (r.evidence ? `<div class="quote">${esc(r.evidence)}</div>` : "") + `</div>`).join("");

  // what people asked for
  const askCards = [...asks]
    .sort((a, b) => (b.deliberate - a.deliberate) ||
                    (b.asked_on || "").localeCompare(a.asked_on || ""))
    .map(r => `<div class="card" ${attrs(r, names)}>` +
      `<div class="rowhead">` +
      `<span class="chip ${r.deliberate ? "on" : ""}">${r.deliberate ? "asked for" : "from a session"}</span>` +
      `<b>${esc(r.tool || "no tool")}</b>` +
      `<span class="chip">${esc(names[r.engineer] || "unknown")}</span>` +
      `<span class="chip">${esc(r.asked_on)}</span></div>` +
      `<div class="said">${esc(r.ask)}</div></div>`).join("");

  // what is known, grouped by tool
  const groups = {};
  for (const r of claims) (groups[r.tool || "no tool"] ??= []).push(r);
  const known = Object.entries(groups).sort((a, b) => b[1].length - a[1].length)
    .map(([tool, rs]) => `<div class="group"><h3 class="gtoggle">${esc(tool)} ` +
      `<span class="gcount">${rs.length}</span></h3>` +
      rs.map(r => `<div class="card" ${attrs(r, names)} data-type="${esc(r.type)}" ` +
        `data-conf="${esc(r.confidence)}" data-gen="${r.generalises ? 1 : 0}">` +
        `<div class="rowhead"><b>${esc(TYPE_LABELS[r.type] || r.type)}</b>` +
        `<span class="chip">${esc(names[r.engineer] || "unknown")}</span>` +
        `<span class="chip">${esc(r.confidence)}</span>` +
        (r.generalises ? '<span class="chip on">generalises</span>' : "") +
        `</div><div class="said">${esc(r.claim)}</div>` +
        (r.why ? `<div class="assumed">why — ${esc(r.why)}</div>` : "") +
        `</div>`).join("") + `</div>`).join("");

  const sessions = [...chats]
    .sort((a, b) => (b.started_at || "").localeCompare(a.started_at || ""))
    .map(r => sessionCard(r, names)).join("");

  $("#navs").innerHTML = [
    ["sessions", "Sessions", chats.length],
    ["stuck", "Where people got stuck", corrections.length],
    ["asks", "What people asked for", asks.length],
    ["knowledge", "What is known", claims.length],
  ].map(([v, lab, n]) => `<div class="nav" data-view="${v}" data-label="${lab}">` +
    `${lab}<span class="n">${n}</span></div>`).join("");

  const view = (id, body, empty) =>
    `<div class="view hide" id="v-${id}">${body}<div class="empty">${empty}</div></div>`;
  $("#views").innerHTML =
    view("sessions", sessions,
         "No sessions yet. They appear once someone has used a tool and signed in.") +
    view("stuck", (bars ? `<div style="margin-bottom:22px">${bars}</div>` : "") + stuck,
         "No corrections recorded yet. They appear once sessions have been summarised.") +
    view("asks", askCards, "Nothing asked for yet.") +
    view("knowledge", known, "No claims yet.");

  $("#rail").innerHTML = `
    <h4>Record</h4>
    <div class="stat"><span>People</span><b>${engineers.length}</b></div>
    <div class="stat"><span>Claims</span><b>${claims.length}</b></div>
    <div class="stat"><span>Corrections</span><b>${corrections.length}</b></div>
    <div class="stat"><span>Requests</span><b>${asks.length}</b></div>
    <h4>Person</h4>${boxes("fwho", count(everything, r => names[r.engineer] || "unknown"))}
    <h4>Tool</h4>${boxes("ftool", count(everything, r => r.tool))}
    <h4>Project</h4>${boxes("fproj", count(everything, r => r.project))}
    <div id="rail-knowledge" class="hide">
      <h4>Type</h4>
      ${count(claims, r => r.type).map(([k, n]) =>
        `<label class="f"><input type="checkbox" class="ftype" value="${esc(k)}">` +
        `${esc(TYPE_LABELS[k] || k)}<span class="n">${n}</span></label>`).join("")}
      <h4>Confidence</h4>${boxes("fconf", count(claims, r => r.confidence))}
      <h4>Scope</h4>
      <label class="f"><input type="checkbox" id="fgen">Only claims that generalise</label>
    </div>`;

  wire();
}

// ---------------------------------------------------- filters and navigation
function picked(cls) {
  const on = $$("." + cls).filter(i => i.checked).map(i => i.value);
  return on.length ? on : null;   // nothing ticked means no constraint
}
function filter() {
  const who = picked("fwho"), tool = picked("ftool"), proj = picked("fproj"),
        type = picked("ftype"), conf = picked("fconf"), gen = $("#fgen")?.checked;
  $$(".card[data-who]").forEach(c => {
    let ok = (!who || who.includes(c.dataset.who))
          && (!tool || tool.includes(c.dataset.tool))
          && (!proj || proj.includes(c.dataset.proj));
    if (ok && c.dataset.type) ok = !type || type.includes(c.dataset.type);
    if (ok && c.dataset.conf) ok = !conf || conf.includes(c.dataset.conf);
    if (ok && gen && c.dataset.gen !== "1") ok = false;
    c.classList.toggle("none", !ok);
  });
  $$(".group").forEach(g => {
    const n = $$(".card:not(.none)", g).length;
    g.classList.toggle("none", n === 0);
    const c = $(".gcount", g); if (c) c.textContent = n;
  });
  $$(".view").forEach(v => {
    const n = $$(".card:not(.none)", v).length;
    const e = $(".empty", v); if (e) e.classList.toggle("none", n > 0);
  });
}
function show(view) {
  $$(".view").forEach(v => v.classList.toggle("hide", v.id !== "v-" + view));
  $$(".nav").forEach(n => n.classList.toggle("on", n.dataset.view === view));
  $("#crumb").textContent = $(`.nav[data-view="${view}"]`).dataset.label;
  $("#rail-knowledge").classList.toggle("hide", view !== "knowledge");
  filter();
}
function wire() {
  $$(".nav").forEach(n => n.onclick = () => show(n.dataset.view));
  $$(".fwho,.ftool,.fproj,.ftype,.fconf,#fgen").forEach(i => i.onchange = filter);
  $$(".gtoggle").forEach(t => t.onclick = () => t.parentElement.classList.toggle("shut"));
  $$(".subtab").forEach(t => t.onclick = e => {
    e.preventDefault(); e.stopPropagation();
    const card = t.closest(".sess");
    $$(".subtab", card).forEach(x => x.classList.toggle("on", x === t));
    $$(".pane", card).forEach(p =>
      p.classList.toggle("hide", !p.classList.contains("pane-" + t.dataset.pane)));
  });
  show("sessions");
}
</script>
